<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 60" width="1000" height="60">
<defs>
  <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#ff6a00" stop-opacity="0"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#2ef2ff" stop-opacity="0"/></linearGradient>
  <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<line x1="0" y1="30" x2="1000" y2="30" stroke="url(#l)" stroke-width="1.5"/>
<rect y="28" width="140" height="4" rx="2" fill="#fff4e0" filter="url(#g)">
  <animate attributeName="x" from="-160" to="1000" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite"/>
</rect>
<rect x="350.0" y="18" width="300" height="24" fill="#000"/>
<text x="500.0" y="35" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" letter-spacing="4" fill="#ffd9a0">ONBOARD SYSTEMS</text>
</svg>